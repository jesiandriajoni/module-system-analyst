<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F2ECE1">
  <title>Modul Belajar System Analyst - Panduan Dasar hingga Siap Kerja</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/docs-bundle.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Langsung ke isi materi</a>
  <div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <header class="site-header">
    <div class="header-left">
      <button type="button" id="menu-toggle" class="icon-btn mobile-only" aria-label="Buka daftar bab" aria-controls="sidebar-nav" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <span>Menu</span>
      </button>
      <a href="#doc=README.md" class="brand-link" id="brand-home">
        <span class="brand-mark" aria-hidden="true">SA</span>
        <span class="brand-title">Modul System Analyst</span>
      </a>
    </div>

    <div class="header-actions">
      <button type="button" id="search-open-btn" class="action-btn" aria-label="Cari materi di semua bab">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span class="btn-label">Cari Materi</span>
        <kbd class="kbd-hint">Ctrl+K</kbd>
      </button>

      <button type="button" id="theme-toggle" class="action-btn" aria-label="Ubah ke mode gelap" aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" id="theme-icon">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span id="theme-label">Mode Gelap</span>
      </button>
    </div>
  </header>

  <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

  <div class="app-shell">
    <nav id="sidebar-nav" class="sidebar" aria-label="Daftar Bab Modul">
      <div class="sidebar-header">
        <div class="progress-summary" id="progress-summary">
          <div class="progress-text-row">
            <span class="progress-title">Progres Baca</span>
            <span id="progress-count" class="progress-count">0 / 33 selesai</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
          </div>
        </div>
        <button type="button" id="sidebar-close" class="icon-btn mobile-only" aria-label="Tutup daftar bab">Tutup</button>
      </div>
      <div id="nav-groups" class="nav-groups"></div>
    </nav>

    <main id="main-content" class="reader-main" tabindex="-1">
      <div id="reader-status" class="reader-status" hidden></div>

      <article id="article-shell" class="article-shell">
        <div class="article-meta-bar">
          <span id="doc-group-label" class="doc-group-label">Memuat...</span>
          <div class="article-controls">
            <button type="button" id="mark-complete-btn" class="complete-btn" aria-pressed="false">
              Tandai Selesai
            </button>
            <button type="button" id="print-btn" class="secondary-btn" aria-label="Cetak atau simpan bab ini sebagai PDF">
              Cetak / PDF
            </button>
          </div>
        </div>

        <details id="inline-toc-box" class="inline-toc-box">
          <summary>Daftar Isi Halaman Ini</summary>
          <ul id="inline-toc-list" class="toc-list"></ul>
        </details>

        <div id="markdown-body" class="markdown-body">
          <p class="loading-state">Memuat materi pembelajaran...</p>
        </div>

        <footer class="article-footer">
          <div class="footer-top-row">
            <button type="button" id="back-to-top-btn" class="secondary-btn">Kembali ke Atas</button>
          </div>
          <nav class="pager-nav" aria-label="Navigasi antar bab">
            <a id="prev-doc-link" class="pager-link pager-prev" href="#doc=README.md" hidden>
              <span class="pager-dir">Sebelumnya</span>
              <span id="prev-doc-title" class="pager-title"></span>
            </a>
            <a id="next-doc-link" class="pager-link pager-next" href="#doc=README.md" hidden>
              <span class="pager-dir">Berikutnya</span>
              <span id="next-doc-title" class="pager-title"></span>
            </a>
          </nav>
        </footer>
      </article>
    </main>

    <aside class="toc-rail" aria-label="Daftar Isi Halaman">
      <div class="toc-sticky">
        <h2 class="toc-heading">Di Halaman Ini</h2>
        <ul id="aside-toc-list" class="toc-list"></ul>
      </div>
    </aside>
  </div>

  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-dialog-title">
    <div class="search-dialog-inner">
      <div class="search-input-row">
        <label for="search-input" id="search-dialog-title" class="sr-only">Cari topik, istilah, atau kode error di seluruh modul</label>
        <input type="search" id="search-input" class="search-input" placeholder="Ketik kata kunci: BPMN, ERD, idempotency, SQL, UAT..." autocomplete="off">
        <button type="button" id="search-close-btn" class="secondary-btn" aria-label="Tutup pencarian">Tutup</button>
      </div>
      <div id="search-results" class="search-results" role="region" aria-live="polite" aria-label="Hasil pencarian"></div>
    </div>
  </dialog>
</body>
</html>
